services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adonis_starter

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adonis_starter"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "3333:3333"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333

      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:3333

      LOG_LEVEL: info
      SESSION_DRIVER: cookie
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: adonis_starter

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: